<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7471" />
    </marker>
  </defs>

  <rect x="290" y="16" width="240" height="46" rx="12" fill="#252525"/>
  <text x="410" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Dynamic pricing: price rises</text>

  <line x1="380" y1="62" x2="240" y2="100" stroke="#6e7471" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="440" y1="62" x2="580" y2="100" stroke="#6e7471" stroke-width="1.5" marker-end="url(#ap)"/>

  <rect x="70" y="104" width="340" height="70" rx="14" fill="#dceff6" stroke="#36a2d4"/>
  <text x="240" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#148cbd">Rider side</text>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#252525">Demand deferred or cancelled (decreases)</text>

  <rect x="410" y="104" width="340" height="70" rx="14" fill="#dff2dc" stroke="#009b16"/>
  <text x="580" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#007d12">Driver side</text>
  <text x="580" y="152" text-anchor="middle" font-size="12" fill="#252525">Attracts more drivers online (increases)</text>

  <rect x="70" y="200" width="680" height="42" rx="10" fill="#f2f6f4"/>
  <text x="410" y="226" text-anchor="middle" font-size="12.5" fill="#252525">Right goal: rebalance supply and demand, shorten rider wait time</text>

  <rect x="70" y="250" width="680" height="42" rx="10" fill="#fdeceb"/>
  <text x="410" y="276" text-anchor="middle" font-size="12.5" fill="#8a2c22">Wrong goal: treating a price hike as simply a revenue lever</text>
</svg>
