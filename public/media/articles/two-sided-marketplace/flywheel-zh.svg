<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#009b16" />
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#36a2d4" />
    </marker>
  </defs>

  <rect x="40" y="90" width="210" height="90" rx="16" fill="#dff2dc" stroke="#009b16" stroke-width="1.5"/>
  <text x="145" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#252525">供給端</text>
  <text x="145" y="152" text-anchor="middle" font-size="14" fill="#252525">（司機）</text>

  <rect x="305" y="80" width="210" height="110" rx="16" fill="#36a2d4"/>
  <text x="410" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">平台</text>
  <text x="410" y="152" text-anchor="middle" font-size="14" fill="#ffffff">媒合系統</text>

  <rect x="570" y="90" width="210" height="90" rx="16" fill="#dceff6" stroke="#36a2d4" stroke-width="1.5"/>
  <text x="675" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#252525">需求端</text>
  <text x="675" y="152" text-anchor="middle" font-size="14" fill="#252525">（乘客）</text>

  <line x1="253" y1="112" x2="302" y2="112" stroke="#009b16" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="277" y="102" text-anchor="middle" font-size="11" fill="#007d12">服務</text>
  <line x1="302" y1="158" x2="253" y2="158" stroke="#009b16" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="277" y="176" text-anchor="middle" font-size="11" fill="#007d12">收入／評價</text>

  <line x1="518" y1="112" x2="567" y2="112" stroke="#148cbd" stroke-width="2" marker-end="url(#arrow-b)"/>
  <text x="543" y="102" text-anchor="middle" font-size="11" fill="#148cbd">服務／體驗</text>
  <line x1="567" y1="158" x2="518" y2="158" stroke="#148cbd" stroke-width="2" marker-end="url(#arrow-b)"/>
  <text x="543" y="176" text-anchor="middle" font-size="11" fill="#148cbd">需求</text>

  <rect x="60" y="222" width="700" height="34" rx="17" fill="#f2f6f4"/>
  <text x="410" y="244" text-anchor="middle" font-size="13.5" fill="#252525">司機越多 → 等待時間越短 → 乘客越多</text>

  <rect x="60" y="262" width="700" height="34" rx="17" fill="#f2f6f4"/>
  <text x="410" y="284" text-anchor="middle" font-size="13.5" fill="#252525">乘客越多 → 司機收入越高 → 司機越多（正向飛輪，也可能反向惡化）</text>
</svg>
