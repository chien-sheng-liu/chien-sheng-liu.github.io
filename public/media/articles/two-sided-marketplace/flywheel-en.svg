<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#009b16" />
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#36a2d4" />
    </marker>
  </defs>

  <rect x="30" y="90" width="220" height="90" rx="16" fill="#dff2dc" stroke="#009b16" stroke-width="1.5"/>
  <text x="140" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#252525">Supply</text>
  <text x="140" y="152" text-anchor="middle" font-size="14" fill="#252525">(Drivers)</text>

  <rect x="300" y="80" width="220" height="110" rx="16" fill="#36a2d4"/>
  <text x="410" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Platform</text>
  <text x="410" y="152" text-anchor="middle" font-size="14" fill="#ffffff">Matching</text>

  <rect x="570" y="90" width="220" height="90" rx="16" fill="#dceff6" stroke="#36a2d4" stroke-width="1.5"/>
  <text x="680" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#252525">Demand</text>
  <text x="680" y="152" text-anchor="middle" font-size="14" fill="#252525">(Riders)</text>

  <line x1="253" y1="112" x2="297" y2="112" stroke="#009b16" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="275" y="102" text-anchor="middle" font-size="11" fill="#007d12">Service</text>
  <line x1="297" y1="158" x2="253" y2="158" stroke="#009b16" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="275" y="176" text-anchor="middle" font-size="11" fill="#007d12">Earnings / ratings</text>

  <line x1="523" y1="112" x2="567" y2="112" stroke="#148cbd" stroke-width="2" marker-end="url(#arrow-b)"/>
  <text x="545" y="102" text-anchor="middle" font-size="11" fill="#148cbd">Service / experience</text>
  <line x1="567" y1="158" x2="523" y2="158" stroke="#148cbd" stroke-width="2" marker-end="url(#arrow-b)"/>
  <text x="545" y="176" text-anchor="middle" font-size="11" fill="#148cbd">Demand</text>

  <rect x="40" y="222" width="740" height="34" rx="17" fill="#f2f6f4"/>
  <text x="410" y="244" text-anchor="middle" font-size="13.5" fill="#252525">More drivers → shorter wait times → more riders</text>

  <rect x="40" y="262" width="740" height="34" rx="17" fill="#f2f6f4"/>
  <text x="410" y="284" text-anchor="middle" font-size="13.5" fill="#252525">More riders → higher driver pay → more drivers (a flywheel — or a vicious cycle in reverse)</text>
</svg>
