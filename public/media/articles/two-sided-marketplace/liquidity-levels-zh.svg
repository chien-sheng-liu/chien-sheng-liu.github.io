<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#252525">市場流動性的三個層次</text>

  <rect x="40" y="52" width="740" height="70" rx="14" fill="#f2f6f4" stroke="#d8dfdc"/>
  <text x="70" y="80" font-size="14" font-weight="700" fill="#007d12">Level 1 · 總量平衡</text>
  <text x="70" y="102" font-size="12.5" fill="#252525">城市內司機總數 vs. 乘客總需求量是否大致匹配</text>

  <rect x="40" y="132" width="740" height="70" rx="14" fill="#dceff6" stroke="#36a2d4"/>
  <text x="70" y="160" font-size="14" font-weight="700" fill="#148cbd">Level 2 · 時間平衡</text>
  <text x="70" y="182" font-size="12.5" fill="#252525">尖峰時段（通勤、用餐）供給是否足夠？離峰時段司機會不會太多？</text>

  <rect x="40" y="212" width="740" height="80" rx="14" fill="#dff2dc" stroke="#009b16"/>
  <text x="70" y="240" font-size="14" font-weight="700" fill="#007d12">Level 3 · 空間平衡</text>
  <text x="70" y="262" font-size="12.5" fill="#252525">市中心司機過剩、郊區司機不足？—— 這是最常被忽略的層次</text>
</svg>
