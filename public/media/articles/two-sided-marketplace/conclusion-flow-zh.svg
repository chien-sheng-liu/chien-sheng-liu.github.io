    <text x="230" y="102" font-size="12.5" fill="#252525">總量／時間／空間三層供需平衡</text>
    <line x1="410" y1="120" x2="410" y2="134" stroke="#9aa39f" stroke-width="1.5" marker-end="url(#ac)"/>
